# Production profile: Google Cloud Run + Cloud SQL for PostgreSQL.
# Nothing environment-specific or secret is committed here; Cloud Run injects every value below.

# Server
server.port=${PORT:8080}

# Cloud Run terminates TLS in front of the container: trust X-Forwarded-* so the app sees https and the public host.
server.forward-headers-strategy=framework

# JSON responses are compressed here, nothing in front of Cloud Run does it.
server.compression.enabled=true
server.compression.min-response-size=1024

# Finish in-flight requests when Cloud Run stops an instance.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Frontend URL (password reset links) and the origins the browser may call the API from: the Firebase Hosting site
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Cloud SQL through the Cloud SQL Java connector: IAM-authorised and encrypted, no IP allow-listing needed.
spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Small pool: the shared-core Cloud SQL instance only allows a few dozen connections in total.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

# Create missing tables and columns on startup, but never drop data.
# (The nightly demo reset job truncates and re-seeds explicitly.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Outgoing email through Gmail. MAIL_USERNAME is the Gmail address from deploy/gcp/config.env and MAIL_PASSWORD its
# app password from Secret Manager. Gmail replaces any other sender address with the account's own.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.from.name=EShop Demo
spring.mail.properties.mail.from.address=${MAIL_USERNAME:noreply@example.com}

# JWT signing key and the code that allows registering an admin (both from Secret Manager)
jwt.secret=${JWT_SECRET}
app.admin.registration-code=${ADMIN_CODE}

# Stripe, in test mode for the public demo. The keys come from Secret Manager; with STRIPE_ENABLED=false in
# deploy/gcp/config.env they are empty and checkout fails, everything else works.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Quiet logs: no SQL statements or bound parameters (they would contain personal data).
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.eshop=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Never expose error details
server.error.include-stacktrace=never
