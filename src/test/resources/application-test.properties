# Settings for the Spring context tests (@ActiveProfiles("test")). They need a PostgreSQL database: locally the one from
# compose.yaml (docker compose up -d), in CI a service container on the same port. Nothing here is a real credential.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5434/ecommerce}
spring.datasource.username=${TEST_DB_USER:ecommerce}
spring.datasource.password=${TEST_DB_PASSWORD:ecommerce}
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-signing-key-that-is-at-least-32-bytes-long
app.admin.registration-code=test-admin-code
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.from.name=EShop Test
spring.mail.properties.mail.from.address=noreply@example.com

stripe.secret-key=sk_test_not_a_real_key
stripe.webhook-secret=whsec_not_a_real_secret
